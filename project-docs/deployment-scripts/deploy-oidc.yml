name: CI/CD - Build & Staged Deploy (OIDC)

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/moel-backend

jobs:
  preflight:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install backend deps
        working-directory: ./backend
        run: |
          if [ -f package.json ]; then npm ci || true; fi
      - name: Run basic tests (if exist)
        working-directory: ./backend
        run: |
          if npm test --silent 2>/dev/null; then echo "Tests passed"; else echo "No tests or tests skipped"; fi

  build:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: preflight
    permissions:
      contents: read
      packages: write
      id-token: write            # required for OIDC
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU (optional for multiarch)
        uses: docker/setup-qemu-action@v2
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Login to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        run: |
          IMAGE_TAG=${{ github.sha }}
          docker build -t "${IMAGE_NAME}:${IMAGE_TAG}" -f backend/Dockerfile .
          docker push "${IMAGE_NAME}:${IMAGE_TAG}"
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}

  terraform-plan:
    name: Terraform Plan (PR/Main)
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write           # required for OIDC
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0
      - name: Configure AWS credentials (OIDC) for terraform plan
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Terraform Init
        working-directory: infra/terraform
        run: terraform init -input=false -reconfigure
      - name: Terraform Format & Validate
        working-directory: infra/terraform
        run: terraform fmt -check || true
      - name: Terraform Plan
        working-directory: infra/terraform
        run: terraform plan -input=false -out=tfplan || terraform plan -input=false

  apply-manual:
    name: Terraform Apply (manual, requires workflow_dispatch or run on main)
    runs-on: ubuntu-latest
    needs: terraform-plan
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0
      - name: Configure AWS credentials (OIDC) for terraform apply
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Terraform Init
        working-directory: infra/terraform
        run: terraform init -input=false -reconfigure
      - name: Terraform Apply
        working-directory: infra/terraform
        run: terraform apply -auto-approve tfplan || terraform apply -auto-approve

  deploy-helm:
    name: Deploy Helm (ArgoCD recommended)
    runs-on: ubuntu-latest
    needs: apply-manual
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials (OIDC) for kubectl/helm access
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Install kubectl and helm
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          install -o root -g root -m 0755 kubectl /usr/local/bin/kubectl || true
          curl -fsSL https://get.helm.sh/helm-v3.12.0-linux-amd64.tar.gz -o helm.tar.gz
          tar -xzf helm.tar.gz
          mv linux-amd64/helm /usr/local/bin/helm || true
      - name: Update kubeconfig (uses terraform output)
        run: |
          CLUSTER_NAME=$(terraform -chdir=infra/terraform output -raw eks_cluster_name || echo "")
          if [ -n "$CLUSTER_NAME" ]; then
            aws eks update-kubeconfig --name "$CLUSTER_NAME" --region ${{ env.AWS_REGION }}
            helm upgrade --install moel-backend infra/helm/moel-backend --set image.tag=${{ github.sha }} --namespace moel --create-namespace
          else
            echo "No EKS cluster name found from terraform outputs; skip helm deploy."
          fi
        env:
          AWS_REGION: ${{ env.AWS_REGION }}
